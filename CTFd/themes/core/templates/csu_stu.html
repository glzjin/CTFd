<div class="form-check">
    <label>
        <input id="isCSU" name="isCSU" type="checkbox" {% if isCSU %}checked{% endif %}>
        是否为校内选手
        <br/>
        (中南大学请勾选并填写后述信息便于后台统计。校外选手则不用填写)
    </label>
</div>
<div id="CSU_info">
    <div class="form-group">
        <label for="real_name-input">
            真实姓名
        </label>
        <input class="form-control" type="text" name="real_name" id="real_name-input"
               value="{% if real_name %}{{real_name}}{% endif %}" />
    </div>
    <div class="form-group">
        <label for="sid-input">
            学号
        </label>
        <input class="form-control" type="text" name="sid" id="sid-input" value="{% if sid %}{{ sid }}{% endif %}"/>
    </div>
    <div class="form-group">
        <label for="school-input">
            学院
        </label>
        <input class="form-control" type="text" name="school" id="school-input"
               value="{% if school%}{{ school }}{% endif %}" />
    </div>
    <div class="form-group">
        <label for="clazz-input">
            专业班级
        </label>
        <input class="form-control" type="text" name="clazz" id="clazz-input"
               value="{% if clazz %}{{ clazz }}{% endif %}" />
    </div>
</div>
<script src="{{url_for('views.themes',path='js/jquery-1.9.0.js')}}"></script>
<script type="text/javascript">
    $("#CSU_info").toggle();
    $(() => {
        $("#isCSU")
            .click(function () {
                $("#CSU_info").toggle(this.checked);
            })
            .change();
    });
</script>
